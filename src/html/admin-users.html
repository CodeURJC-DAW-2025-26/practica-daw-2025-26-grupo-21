<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Admin - La Phonoteka</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin-management.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body data-theme="light">

    <header class="site-header">
        <div class="container header-container">
            <a href="admin-dashboard.html" class="logo">La Phonoteka <span class="admin-badge">ADMIN</span></a>
            <nav class="user-actions">
                <a href="admin-dashboard.html" class="btn-profile">
                    <span class="material-icons">dashboard</span>
                    <span>Dashboard</span>
                </a>
                <button class="theme-toggle" id="theme-toggle">
                    <span class="material-icons icon-light">light_mode</span>
                    <span class="material-icons icon-dark">dark_mode</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="admin-header">
            <h1>User Management</h1>
            <p>View and manage all registered accounts.</p>
        </div>

        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div class="user-cell">
                                <img src="https://i.pravatar.cc/40?u=1" alt="avatar">
                                <span>a.morales.2019</span>
                            </div>
                        </td>
                        <td>a.morales.2019@alumnos.urjc.es</td>
                        <td><span class="badge badge-admin">Admin</span></td>
                        <td><span class="status-indicator active">Active</span></td>
                        <td class="actions-cell">
                            <button class="action-btn edit" title="Edit User"><span class="material-icons">edit</span></button>
                            <button class="action-btn delete" title="Delete User"><span class="material-icons">delete</span></button>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="user-cell">
                                <img src="https://i.pravatar.cc/40?u=2" alt="avatar">
                                <span>VinylVortex</span>
                            </div>
                        </td>
                        <td>vortex@mail.com</td>
                        <td><span class="badge badge-user">User</span></td>
                        <td><span class="status-indicator active">Active</span></td>
                        <td class="actions-cell">
                            <button class="action-btn edit" title="Edit User"><span class="material-icons">edit</span></button>
                            <button class="action-btn delete" title="Delete User"><span class="material-icons">delete</span></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
