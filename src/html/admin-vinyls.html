<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Vinyls - Admin - La Phonoteka</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin-management.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body data-theme="light">

    <header class="site-header">
        <div class="container header-container">
            <a href="admin-dashboard.html" class="logo">La Phonoteka <span class="admin-badge">ADMIN</span></a>
            <nav class="user-actions">
                <a href="admin-dashboard.html" class="btn-profile">
                    <span class="material-icons">dashboard</span>
                    <span>Dashboard</span>
                </a>
                <button class="theme-toggle" id="theme-toggle">
                    <span class="material-icons">light_mode</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="admin-header">
            <h1>Vinyl Inventory Management</h1>
            <p>Supervise all vinyl records listed on the platform.</p>
        </div>

        <div class="table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Vinyl</th>
                        <th>Seller</th>
                        <th>Genre</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div class="vinyl-cell">
                                <img src="https://picsum.photos/seed/v1/50/50" alt="cover">
                                <div>
                                    <p class="table-main-text">The Dark Side of the Moon</p>
                                    <p class="table-sub-text">Pink Floyd</p>
                                </div>
                            </div>
                        </td>
                        <td>a.morales.2019</td>
                        <td>Rock</td>
                        <td class="price-cell">35,00 €</td>
                        <td class="actions-cell">
                            <button class="action-btn edit"><span class="material-icons">edit</span></button>
                            <button class="action-btn delete"><span class="material-icons">delete</span></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
