<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - La Phonoteka</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/checkout.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body data-theme="light">

    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo">La Phonoteka</a>
            <nav class="user-actions">
                <button class="theme-toggle" id="theme-toggle">
                    <span class="material-icons icon-light">light_mode</span>
                    <span class="material-icons icon-dark">dark_mode</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="checkout-layout">
            <section class="checkout-form-section">
                <h2>Información de Envío</h2>
                <form id="checkout-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Nombre completo</label>
                            <input type="text" id="name" required placeholder="John Doe">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="address">Dirección de entrega</label>
                        <input type="text" id="address" required placeholder="Calle Melancolía 13">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">Ciudad</label>
                            <input type="text" id="city" required placeholder="Madrid">
                        </div>
                        <div class="form-group">
                            <label for="zip">Código Postal</label>
                            <input type="text" id="zip" required placeholder="28001">
                        </div>
                    </div>

                    <h2 class="section-title">Método de Pago</h2>
                    <div class="form-group">
                        <label for="card">Número de tarjeta</label>
                        <input type="text" id="card" required placeholder="0000 0000 0000 0000">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="exp">Caducidad</label>
                            <input type="text" id="exp" required placeholder="MM/AA">
                        </div>
                        <div class="form-group">
                            <label for="cvv">CVV</label>
                            <input type="text" id="cvv" required placeholder="123">
                        </div>
                    </div>
                </form>
            </section>

            <aside class="order-summary-section">
                <div class="summary-card">
                    <h3>Resumen del Pedido</h3>
                    <div id="checkout-items" class="summary-items">
                        </div>
                    <hr class="divider">
                    <div class="summary-totals">
                        <div class="total-row">
                            <span>Subtotal</span>
                            <span id="subtotal">0,00 €</span>
                        </div>
                        <div class="total-row">
                            <span>Envío</span>
                            <span>4,50 €</span>
                        </div>
                        <div class="total-row main-total">
                            <span>Total</span>
                            <span id="final-total">0,00 €</span>
                        </div>
                    </div>
                    <button type="submit" form="checkout-form" class="btn btn-primary btn-full-width">
                        Confirmar Compra
                    </button>
                    <a href="index.html" class="back-link">Volver a la tienda</a>
                </div>
            </aside>
        </div>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
