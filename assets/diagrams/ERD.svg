<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550">
  <style>
    .box { fill: white; stroke: black; stroke-width: 1.5; }
    .header-line { stroke: black; stroke-width: 1.5; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: black; }
    .label { font-family: Arial, sans-serif; font-size: 16px; fill: black; }
    .line { stroke: black; stroke-width: 1; fill: none; }
  </style>

  <rect x="20" y="20" width="180" height="130" class="box" />
  <line x1="20" y1="45" x2="200" y2="45" class="header-line" />
  <text x="110" y="38" text-anchor="middle" class="text" font-weight="bold">Vinilo</text>

  <rect x="340" y="180" width="200" height="160" class="box" />
  <line x1="340" y1="210" x2="540" y2="210" class="header-line" />
  <text x="440" y="203" text-anchor="middle" class="text" font-weight="bold">Usuario</text>

  <rect x="20" y="360" width="180" height="150" class="box" />
  <line x1="20" y1="390" x2="200" y2="390" class="header-line" />
  <text x="110" y="383" text-anchor="middle" class="text" font-weight="bold">Transacción</text>

  <rect x="630" y="440" width="180" height="100" class="box" />
  <line x1="630" y1="470" x2="810" y2="470" class="header-line" />
  <text x="720" y="463" text-anchor="middle" class="text" font-weight="bold">Valoración</text>

  <line x1="200" y1="85" x2="400" y2="85" class="line" />
  <line x1="400" y1="85" x2="400" y2="180" class="line" />
  <text x="210" y="80" class="text">1</text>
  <text x="365" y="105" class="label">+publica</text>
  <text x="375" y="175" class="text">0..*</text>

  <line x1="110" y1="150" x2="110" y2="360" class="line" />
  <text x="95" y="170" class="text">1</text>
  <text x="115" y="260" class="label">+involucra</text>
  <text x="85" y="355" class="text">1..*</text>

  <line x1="200" y1="390" x2="340" y2="280" class="line" />
  <text x="205" y="385" class="text">1</text>
  <text x="240" y="325" class="label">+compra</text>
  <text x="315" y="275" class="text">0..*</text>

  <line x1="200" y1="430" x2="410" y2="430" class="line" />
  <line x1="410" y1="430" x2="410" y2="340" class="line" />
  <text x="205" y="425" class="text">1</text>
  <text x="320" y="450" class="label">+vende</text>
  <text x="390" y="355" class="text">0..*</text>

  <line x1="200" y1="485" x2="630" y2="485" class="line" />
  <text x="205" y="480" class="text">1</text>
  <text x="330" y="480" class="label">+genera</text>
  <text x="600" y="500" class="text">0..2</text>

  <line x1="510" y1="340" x2="720" y2="440" class="line" />
  <text x="515" y="355" class="text">0..*</text>
  <text x="610" y="375" class="label">+realiza</text>
  <text x="705" y="435" class="text">1</text>

  <line x1="540" y1="320" x2="720" y2="440" class="line" />
  <text x="545" y="335" class="text">0..*</text>
  <text x="610" y="425" class="label">+recibe</text>
  <text x="725" y="435" class="text">1</text>

</svg>
