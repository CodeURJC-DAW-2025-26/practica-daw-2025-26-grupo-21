<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sell your Vinyl - La Phonoteka</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/add-vinyl.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body data-theme="light">

    <header class="site-header">
        <div class="container header-container">
            <a href="/" class="logo">La Phonoteka</a>
            <nav class="user-actions">
                <a href="/user/profile" class="btn-profile">
                    <span class="material-icons">account_circle</span>
                    <span class="username-text">My Profile</span>
                </a>
                <button class="theme-toggle" id="theme-toggle">
                    <span class="material-icons icon-light">light_mode</span>
                    <span class="material-icons icon-dark">dark_mode</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="form-page-container">
        <div class="form-wrapper wide">
            <h1>List a New Vinyl</h1>
            <p>Fill in the details to put your record up for sale.</p>

            <form class="add-vinyl-form" method="post" action="/vinyl/add" enctype="multipart/form-data">
                <div class="form-section">
                    <div class="form-group">
                        <label for="vinyl-title">Album Title</label>
                        <input type="text" id="vinyl-title" name="title" placeholder="e.g. Discovery" required>
                    </div>
                    <div class="form-group">
                        <label for="vinyl-artist">Artist</label>
                        <input type="text" id="vinyl-artist" name="artist" placeholder="e.g. Daft Punk" required>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-group">
                        <label for="vinyl-genre">Genre</label>
                        <select id="vinyl-genre" name="genre" required>
                            <option value="" disabled selected>Select a genre</option>
                            <option value="Rock">Rock</option>
                            <option value="Pop">Pop</option>
                            <option value="Electronic">Electronic</option>
                            <option value="Jazz">Jazz</option>
                            <option value="Indie">Indie</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="vinyl-price">Price (€)</label>
                        <input type="number" id="vinyl-price" name="price" step="0.01" placeholder="29.99" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Vinyl Photo (Mandatory)</label>
                    <div class="image-upload-box">
                        <span class="material-icons">add_a_photo</span>
                        <p>Click to upload or drag and drop</p>
                        <input type="file" id="vinyl-image" name="image" accept="image/*" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary btn-full-width">Publish Vinyl</button>
                    <a href="/user/profile" class="btn btn-secondary btn-full-width" style="text-align: center;">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/script.js"></script>
</body>
</html>
