<!DOCTYPE html>
<html lang="es">
{{>partials/head}}
<body data-theme="light">

{{>partials/header}}

<main class="container">
    <div class="checkout-layout">
        <section class="checkout-form-section">
            <h2>Información de Envío</h2>
            <form id="checkout-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name">Nombre completo</label>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>
                </div>
                <div class="form-group">
                    <label for="address">Dirección de entrega</label>
                    <input type="text" id="address" required placeholder="Calle Melancolía 13">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="city">Ciudad</label>
                        <input type="text" id="city" required placeholder="Madrid">
                    </div>
                    <div class="form-group">
                        <label for="zip">Código Postal</label>
                        <input type="text" id="zip" required placeholder="28001">
                    </div>
                </div>

                <h2 class="section-title">Método de Pago</h2>
                <div class="form-group">
                    <label for="card">Número de tarjeta</label>
                    <input type="text" id="card" required placeholder="0000 0000 0000 0000">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="exp">Caducidad</label>
                        <input type="text" id="exp" required placeholder="MM/AA">
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" required placeholder="123">
                    </div>
                </div>
            </form>
        </section>

        <aside class="order-summary-section">
            <div class="summary-card">
                <h3>Resumen del Pedido</h3>
                <div class="summary-items">
                    {{#orderItems}}
                    <div class="summary-item">
                        <span class="item-name">{{title}} × {{quantity}}</span>
                        <span>{{price}}</span>
                    </div>
                    {{/orderItems}}
                </div>
                <hr class="divider">
                <div class="summary-totals">
                    <div class="total-row">
                        <span>Subtotal</span>
                        <span>{{subtotal}}</span>
                    </div>
                    <div class="total-row">
                        <span>Envío</span>
                        <span>{{shipping}}</span>
                    </div>
                    <div class="total-row main-total">
                        <span>Total</span>
                        <span>{{total}}</span>
                    </div>
                </div>
                <button type="submit" form="checkout-form" class="btn btn-primary btn-full-width">
                    Confirmar Compra
                </button>
                <a href="/" class="back-link">Volver a la tienda</a>
            </div>
        </aside>
    </div>
</main>

<script src="/js/script.js"></script>
</body>
</html>
