<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Rating - La Phonoteka</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/rating.css"> <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body data-theme="light">

    <main class="form-page-container">
        <div class="form-wrapper">
            <h2>Rate your Experience</h2>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">
                How was your transaction with <strong>VinylVortex</strong>?
            </p>

            <form>
                <div class="form-group">
                    <label>Rating</label>
                    <div class="star-rating">
                        <input type="radio" id="5-stars" name="rating" value="5"><label for="5-stars" class="material-icons">star</label>
                        <input type="radio" id="4-stars" name="rating" value="4"><label for="4-stars" class="material-icons">star</label>
                        <input type="radio" id="3-stars" name="rating" value="3"><label for="3-stars" class="material-icons">star</label>
                        <input type="radio" id="2-stars" name="rating" value="2"><label for="2-stars" class="material-icons">star</label>
                        <input type="radio" id="1-star" name="rating" value="1"><label for="1-star" class="material-icons">star</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comment">Your Comment</label>
                    <textarea id="comment" placeholder="Tell others about the vinyl state, shipping, etc..."></textarea>
                </div>

                <div class="form-actions" style="justify-content: center;">
                    <button type="submit" class="btn btn-primary btn-full-width">Submit Rating</button>
                </div>
                <div class="form-links">
                    <a href="profile.html">Cancel and go back</a>
                </div>
            </form>
        </div>
    </main>

    <script src="/js/script.js"></script>
</body>
</html>
