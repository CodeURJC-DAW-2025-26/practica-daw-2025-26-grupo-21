<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Phonoteka - Mi Colección</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css"> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body data-theme="light"> 

    <header class="site-header">
        <div class="container header-container">
            <a href="index.html" class="logo">La Phonoteka</a>
            
            <div class="search-bar">
                <span class="material-icons">search</span>
                <input type="text" placeholder="¿Qué buscas hoy?">
            </div>

            <nav class="user-actions">
                <button class="cart-button" id="cart-btn" aria-label="View shopping cart">
                    <span class="material-icons">shopping_cart</span>
                    <span class="cart-badge" id="cart-count">0</span>
                </button>

                <a href="profile.html" class="btn-profile">
                    <span class="material-icons">account_circle</span>
                    <span class="username-text">Mi Perfil</span>
                </a>

                <button class="theme-toggle" id="theme-toggle" aria-label="Theme toggle">
                    <span class="material-icons icon-light">light_mode</span>
                    <span class="material-icons icon-dark">dark_mode</span>
                </button>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Bienvenido de nuevo, Adrián</h1>
                <p>Sigue explorando las joyas que tenemos para tu colección.</p>
            </div>
        </section>

        <section class="vinyl-gallery">
            <div class="container">
                <div class="vinyl-grid">
                    </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 La Phonoteka. Hecho con ❤️ para coleccionistas.</p>
        </div>
    </footer>

    <div id="cart-drawer" class="cart-drawer">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button id="close-cart" class="close-btn">
                <span class="material-icons">close</span>
            </button>
        </div>

        <div id="cart-items-container" class="cart-items">
            <div class="empty-cart-msg">Your cart is empty</div>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cart-total-amount">0,00 €</span>
            </div>
            <a href="checkout.html" class="btn btn-primary btn-full-width" style="text-align: center; display: block;">
                Checkout
            </a>
        </div>
    </div>

    <div id="cart-overlay" class="cart-overlay"></div>

    <script src="/js/script.js"></script>
</body>
</html>
